        <h1>Welcome back.</h1>
        <p class="auth-sub">Log in to continue building your trail. Your links, store and insights are all waiting.</p>

        <aside class="auth-demo-note">
            <strong>Portfolio demo</strong>
            <span>Your account stays in this browser. Use the email and demo password you created here.</span>
        </aside>

        <form id="login-form" novalidate>
            <div class="form-field">
                <label for="login-email">Email address</label>
                <input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="form-field">
                <label for="login-password">Demo password</label>
                <input id="login-password" name="password" type="password" placeholder="At least 8 characters" autocomplete="current-password" required minlength="8">
            </div>

            <div class="auth-actions">
                <button class="button button-dark" type="submit">Log in</button>
            </div>
            <p class="auth-message" id="auth-message" aria-live="polite"></p>
        </form>

        <div class="auth-divider">New to BioTrail?</div>
        <p class="auth-alt">Don't have an account? <a href="signup.html">Sign up free</a></p>
